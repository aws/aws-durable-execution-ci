name: Codex Issue Implementation

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      issue-number:
        description: Optional authorized issue number to reconcile
        required: false
        type: string
        default: ""
      no-pr-label:
        description: Label applied when no pull request is required
        required: false
        type: string
        default: codex:no-pr
      max-issues:
        description: Maximum discovered work items processed per run
        required: false
        type: number
        default: 3
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: choice
        options:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        default: xhigh
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      issue-number:
        description: Optional authorized issue number to reconcile
        required: false
        type: string
        default: ""
      no-pr-label:
        description: Label applied when no pull request is required
        required: false
        type: string
        default: codex:no-pr
      max-issues:
        description: Maximum discovered work items processed per run
        required: false
        type: number
        default: 3
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: xhigh
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Codex on Amazon Bedrock
        required: false

permissions: {}

env:
  DEFAULT_NO_PR_LABEL: codex:no-pr
  DEFAULT_MAX_ISSUES: "3"
  DEFAULT_CODEX_MODEL: openai.gpt-5.6-sol
  DEFAULT_REASONING_EFFORT: xhigh

jobs:
  resolve:
    name: Resolve authorized work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      publish_actor: ${{ steps.publisher.outputs.publish_actor }}

    steps:
      - name: Check out Codex implementation toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve publication actor
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_actor="$(
            gh api graphql \
              --field query='query { viewer { login } }' \
              --jq '.data.viewer.login'
          )"
          if [[ ! "$publish_actor" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]]; then
            echo "::error::Could not resolve the automatic token actor."
            exit 1
          fi
          echo "publish_actor=$publish_actor" >> "$GITHUB_OUTPUT"

      - name: Restore discovery cursor
        if: >-
          (github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch') &&
          inputs['issue-number'] == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codex-issue-discovery
          key: codex-issue-discovery-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            codex-issue-discovery-${{ github.repository_id }}-

      - name: Resolve work items
        id: resolve
        env:
          CODEX_PUBLISH_ACTOR: >-
            ${{ steps.publisher.outputs.publish_actor }}
          DISCOVERY_CURSOR_PATH: >-
            ${{ runner.temp }}/codex-issue-discovery/cursor.json
          GH_TOKEN: ${{ github.token }}
          MAX_ISSUES: >-
            ${{ format('{0}', inputs['max-issues']) ||
                env.DEFAULT_MAX_ISSUES }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
          REQUESTED_ISSUE_NUMBER: ${{ inputs['issue-number'] }}
        run: >-
          python3 scripts/codex_issue_implementation.py
          resolve "$GITHUB_EVENT_PATH"

      - name: Save discovery cursor
        if: >-
          always() &&
          steps.resolve.outcome == 'success' &&
          (github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch') &&
          inputs['issue-number'] == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codex-issue-discovery
          key: codex-issue-discovery-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

  implement:
    name: Reconcile ${{ matrix.work_key }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/codex-issue-worker.yml
    with:
      issue-number: ${{ matrix.issue_number }}
      pull-request-number: ${{ matrix.pull_request_number }}
      address-only: ${{ matrix.address_only }}
      work-key: ${{ matrix.work_key }}
      publication-actor: ${{ needs.resolve.outputs.publish_actor }}
      no-pr-label: >-
        ${{ inputs['no-pr-label'] || 'codex:no-pr' }}
      model: ${{ inputs['model'] || 'openai.gpt-5.6-sol' }}
      reasoning-effort: >-
        ${{ inputs['reasoning-effort'] || 'xhigh' }}
      allow-workflow-changes: >-
        ${{ inputs['allow-workflow-changes'] || false }}
    secrets: inherit
