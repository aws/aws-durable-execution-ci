name: Codex Issue Implementation

on:
  issues:
    types: [labeled]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      issue-number:
        description: Optional eligible issue number to reconcile
        required: false
        type: string
        default: ""
      implementation-label:
        description: Label that opts an issue into Codex implementation
        required: false
        type: string
        default: codex:implement
      no-pr-label:
        description: Label applied when no pull request is required
        required: false
        type: string
        default: codex:no-pr
      max-issues:
        description: Maximum discovered issues processed per run
        required: false
        type: number
        default: 3
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: choice
        options:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        default: high
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      issue-number:
        description: Optional eligible issue number to reconcile
        required: false
        type: string
        default: ""
      implementation-label:
        description: Label that opts an issue into Codex implementation
        required: false
        type: string
        default: codex:implement
      no-pr-label:
        description: Label applied when no pull request is required
        required: false
        type: string
        default: codex:no-pr
      max-issues:
        description: Maximum discovered issues processed per run
        required: false
        type: number
        default: 3
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: high
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Codex on Amazon Bedrock
        required: false
      CODEX_PUBLISH_TOKEN:
        description: GitHub App token or fine-grained PAT used for publication
        required: false

permissions: {}

env:
  DEFAULT_IMPLEMENTATION_LABEL: codex:implement
  DEFAULT_NO_PR_LABEL: codex:no-pr
  DEFAULT_MAX_ISSUES: "3"
  DEFAULT_CODEX_MODEL: openai.gpt-5.6-sol
  DEFAULT_REASONING_EFFORT: high

jobs:
  resolve_publication_actor:
    name: Resolve publication actor
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    environment: ai-pr-review-runtime
    timeout-minutes: 5
    permissions: {}
    outputs:
      publish_actor: ${{ steps.publisher.outputs.publish_actor }}

    steps:
      - name: Resolve publication actor
        id: publisher
        env:
          CODEX_PUBLISH_TOKEN: ${{ secrets.CODEX_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$CODEX_PUBLISH_TOKEN" ]]; then
            echo "::error::CODEX_PUBLISH_TOKEN must be configured."
            exit 1
          fi

          publish_actor="$(
            GH_TOKEN="$CODEX_PUBLISH_TOKEN" gh api graphql \
              --field query='query { viewer { login } }' \
              --jq '.data.viewer.login'
          )"
          if [[ ! "$publish_actor" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]]; then
            echo "::error::Could not resolve the publication token actor."
            exit 1
          fi
          echo "publish_actor=$publish_actor" >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve eligible issues
    needs: resolve_publication_actor
    if: >-
      always() &&
      (
        needs.resolve_publication_actor.result == 'success' ||
        needs.resolve_publication_actor.result == 'skipped'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}

    steps:
      - name: Check out Codex implementation toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve work to issue numbers
        id: resolve
        env:
          CODEX_PUBLISH_ACTOR: >-
            ${{ needs.resolve_publication_actor.outputs.publish_actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPLEMENTATION_LABEL: >-
            ${{ inputs['implementation-label'] ||
                env.DEFAULT_IMPLEMENTATION_LABEL }}
          MAX_ISSUES: >-
            ${{ format('{0}', inputs['max-issues']) ||
                env.DEFAULT_MAX_ISSUES }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
          REQUESTED_ISSUE_NUMBER: ${{ inputs['issue-number'] }}
        run: >-
          python3 scripts/codex_issue_implementation.py
          resolve "$GITHUB_EVENT_PATH"

  reconcile:
    name: Reconcile issue ${{ matrix.issue_number }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: >-
        codex-issue-${{ github.repository_id }}-${{ matrix.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ai-pr-review-runtime
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read

    steps:
      # Scripts and prompts are copied out of the worktree before the target
      # repository is checked out. Codex can read but cannot modify this copy.
      - name: Load trusted Codex implementation toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .codex-implementation-toolkit
          sparse-checkout: |
            .github/prompts/codex-issue-implementation.md
            .github/prompts/codex-issue-implementation-schema.json
            scripts/codex_issue_implementation.py
            scripts/prepare_codex_implementation_user.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reserve trusted toolkit
        env:
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: |
          set -euo pipefail

          install -d -m 755 "$TOOLKIT_PATH"
          cp -R \
            .codex-implementation-toolkit/.github \
            .codex-implementation-toolkit/scripts \
            "$TOOLKIT_PATH/"
          chmod -R a-w "$TOOLKIT_PATH"

      - name: Validate Codex implementation configuration
        id: config
        env:
          ALLOW_WORKFLOW_CHANGES: >-
            ${{ inputs['allow-workflow-changes'] || false }}
          CODEX_PUBLISH_TOKEN: ${{ secrets.CODEX_PUBLISH_TOKEN }}
          CODEX_MODEL: ${{ inputs['model'] || env.DEFAULT_CODEX_MODEL }}
          CODEX_REASONING_EFFORT: >-
            ${{ inputs['reasoning-effort'] ||
                env.DEFAULT_REASONING_EFFORT }}
          IMPLEMENTATION_LABEL: >-
            ${{ inputs['implementation-label'] ||
                env.DEFAULT_IMPLEMENTATION_LABEL }}
          MAX_ISSUES: >-
            ${{ format('{0}', inputs['max-issues']) ||
                env.DEFAULT_MAX_ISSUES }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
        run: |
          set -euo pipefail

          if [[ ! "$CODEX_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
            echo "::error::Codex model must be a non-empty model ID."
            exit 1
          fi

          case "$CODEX_REASONING_EFFORT" in
            none|minimal|low|medium|high|xhigh|max)
              ;;
            *)
              echo "::error::Unsupported Codex reasoning effort."
              exit 1
              ;;
          esac

          if [[ -z "$IMPLEMENTATION_LABEL" || -z "$NO_PR_LABEL" ]]; then
            echo "::error::Automation labels must be non-empty."
            exit 1
          fi

          if [[ -z "$CODEX_PUBLISH_TOKEN" ]]; then
            echo "::error::CODEX_PUBLISH_TOKEN must be configured."
            exit 1
          fi

          publish_actor="$(
            GH_TOKEN="$CODEX_PUBLISH_TOKEN" gh api graphql \
              --field query='query { viewer { login } }' \
              --jq '.data.viewer.login'
          )"
          if [[ ! "$publish_actor" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]]; then
            echo "::error::Could not resolve the publication token actor."
            exit 1
          fi

          {
            echo "model=$CODEX_MODEL"
            echo "reasoning_effort=$CODEX_REASONING_EFFORT"
            echo "allow_workflow_changes=$ALLOW_WORKFLOW_CHANGES"
            echo "publish_actor=$publish_actor"
          } >> "$GITHUB_OUTPUT"

      - name: Re-fetch issue and pull request state
        id: prepare
        env:
          CODEX_PUBLISH_ACTOR: ${{ steps.config.outputs.publish_actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPLEMENTATION_LABEL: >-
            ${{ inputs['implementation-label'] ||
                env.DEFAULT_IMPLEMENTATION_LABEL }}
          ISSUE_NUMBER: ${{ matrix.issue_number }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: >-
          python3 "$TOOLKIT_PATH/scripts/codex_issue_implementation.py"
          prepare
          "${RUNNER_TEMP}/codex-implementation-state.json"
          "${RUNNER_TEMP}/codex-implementation-context.json"

      - name: Check out exact implementation target
        if: steps.prepare.outputs.run_model == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.prepare.outputs.target_repository }}
          ref: ${{ steps.prepare.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare unprivileged Codex user
        if: steps.prepare.outputs.run_model == 'true'
        env:
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: |
          set -euo pipefail

          bash "$TOOLKIT_PATH/scripts/prepare_codex_implementation_user.sh"

          sudo sh -c \
            'printf "%s\n" \
              "Defaults:runner env_keep += \"AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION\"" \
              > /etc/sudoers.d/codex-implementation-env'
          sudo chmod 440 /etc/sudoers.d/codex-implementation-env
          sudo visudo -cf /etc/sudoers.d/codex-implementation-env

          current_userns="$(
            sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true
          )"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(
            sysctl -n kernel.apparmor_restrict_unprivileged_userns \
              2>/dev/null || true
          )"
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Node.js
        if: steps.prepare.outputs.run_model == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Install Codex CLI
        if: steps.prepare.outputs.run_model == 'true'
        run: npm install -g "@openai/codex@0.147.0"

      - name: Configure AWS credentials for Codex
        if: steps.prepare.outputs.run_model == 'true'
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          role-session-name: >-
            codex-issue-${{ matrix.issue_number }}-${{ github.run_id }}
          aws-region: us-east-1
          inline-session-policy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": [
                  "bedrock-mantle:CreateInference",
                  "bedrock-mantle:GetProject",
                  "bedrock-mantle:ListProjects",
                  "bedrock-mantle:ListTagsForResources"
                ],
                "Resource": "*"
              }]
            }
          mask-aws-account-id: true
          output-credentials: true
          output-env-credentials: false

      - name: Implement current issue work with Codex
        if: steps.prepare.outputs.run_model == 'true'
        id: model
        env:
          ALLOW_WORKFLOW_CHANGES: >-
            ${{ steps.config.outputs.allow_workflow_changes }}
          AWS_ACCESS_KEY_ID: >-
            ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: >-
            ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: >-
            ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          CODEX_MODEL: ${{ steps.config.outputs.model }}
          CODEX_REASONING_EFFORT: >-
            ${{ steps.config.outputs.reasoning_effort }}
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: |
          set -euo pipefail

          codex_bin="$(command -v codex)"
          output_parent="${RUNNER_TEMP}/codex-implementation-output"
          sudo install \
            -d \
            -m 711 \
            -o root \
            -g root \
            "$output_parent"
          output_dir="${output_parent}/result"
          sudo install \
            -d \
            -m 750 \
            -o root \
            -g codex-implement \
            "$output_dir"
          output_file="${output_dir}/result.json"
          output_schema="${output_dir}/schema.json"
          prompt_file="${RUNNER_TEMP}/codex-implementation-prompt.md"
          trusted_prompt="${TOOLKIT_PATH}/.github/prompts/codex-issue-implementation.md"
          trusted_schema="${TOOLKIT_PATH}/.github/prompts/codex-issue-implementation-schema.json"
          trap 'sudo rm -rf "$output_parent"' EXIT

          {
            cat "$trusted_prompt"
            printf '\n\n%s\n' '```json'
            cat "${RUNNER_TEMP}/codex-implementation-context.json"
            printf '%s\n' '```'
          } > "$prompt_file"

          sudo install \
            -m 440 \
            -o root \
            -g codex-implement \
            "$trusted_schema" \
            "$output_schema"
          sudo install \
            -m 600 \
            -o codex-implement \
            -g codex-implement \
            /dev/null \
            "$output_file"

          # The runner intentionally opens stdin before sudo changes users.
          # shellcheck disable=SC2024
          sudo -u codex-implement -- timeout \
            --signal=TERM \
            --kill-after=30s \
            40m \
            env \
            CODEX_HOME=/home/codex-implement/.codex \
            GIT_OPTIONAL_LOCKS=0 \
            HOME=/home/codex-implement \
            "$codex_bin" \
            --ask-for-approval never \
            --sandbox workspace-write \
            --disable apps \
            --disable browser_use \
            --disable computer_use \
            --disable hooks \
            --disable image_generation \
            --disable multi_agent \
            --disable plugins \
            --disable view_image \
            --strict-config \
            --model "$CODEX_MODEL" \
            --config \
              "model_reasoning_effort=\"${CODEX_REASONING_EFFORT}\"" \
            --config 'model_provider="amazon-bedrock"' \
            --config 'web_search="disabled"' \
            --config 'allow_login_shell=false' \
            --config 'history.persistence="none"' \
            --config 'sandbox_workspace_write.network_access=false' \
            --config 'sandbox_workspace_write.exclude_slash_tmp=true' \
            --config \
              'sandbox_workspace_write.exclude_tmpdir_env_var=true' \
            --config 'shell_environment_policy.inherit="core"' \
            --config \
              'shell_environment_policy.set={HOME="/home/codex-implement",GIT_OPTIONAL_LOCKS="0"}' \
            --config \
              'shell_environment_policy.exclude=["AWS_*","GH_*","GITHUB_*"]' \
            exec \
            --ignore-user-config \
            --cd "$GITHUB_WORKSPACE" \
            --output-last-message "$output_file" \
            --output-schema "$output_schema" \
            --color never \
            --ephemeral \
            - < "$prompt_file"

          sudo install \
            -m 600 \
            -o runner \
            -g runner \
            "$output_file" \
            "${RUNNER_TEMP}/codex-implementation-result.json"

          sudo chown -R runner:runner "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX,go-rwx "$GITHUB_WORKSPACE"

          python3 "$TOOLKIT_PATH/scripts/codex_issue_implementation.py" \
            validate-model \
            "${RUNNER_TEMP}/codex-implementation-result.json" \
            "${RUNNER_TEMP}/codex-implementation-state.json" \
            "${RUNNER_TEMP}/codex-implementation-artifact.json" \
            "${RUNNER_TEMP}/codex-implementation.patch" \
            "$GITHUB_WORKSPACE"

      - name: Check out exact publication target
        if: >-
          steps.prepare.outputs.run_model == 'true' &&
          steps.model.outputs.outcome == 'changed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.prepare.outputs.target_repository }}
          ref: ${{ steps.prepare.outputs.target_sha }}
          fetch-depth: 0
          token: ${{ secrets.CODEX_PUBLISH_TOKEN }}
          persist-credentials: true

      - name: Revalidate and publish
        if: >-
          steps.prepare.outputs.action != 'skip' &&
          (
            steps.prepare.outputs.run_model != 'true' ||
            steps.model.outcome == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.CODEX_PUBLISH_TOKEN }}
          IMPLEMENTATION_LABEL: >-
            ${{ inputs['implementation-label'] ||
                env.DEFAULT_IMPLEMENTATION_LABEL }}
          ISSUE_NUMBER: ${{ matrix.issue_number }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: >-
          python3 "$TOOLKIT_PATH/scripts/codex_issue_implementation.py"
          publish
          "${RUNNER_TEMP}/codex-implementation-state.json"
          "${RUNNER_TEMP}/codex-implementation-artifact.json"
          "${RUNNER_TEMP}/codex-implementation.patch"
          "$GITHUB_WORKSPACE"
