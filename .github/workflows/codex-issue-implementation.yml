name: Codex Issue Implementation

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Authorized issue number to implement
        required: true
        type: string
      environment-name:
        description: GitHub environment used for the model job
        required: false
        type: string
        default: ai-pr-review-runtime
      no-pr-label:
        description: Label applied when no pull request is required
        required: false
        type: string
        default: codex:no-pr
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: choice
        options:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        default: xhigh
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      issue-number:
        description: Optional authorized issue number to implement
        required: false
        type: string
        default: ""
      environment-name:
        description: GitHub environment used for the model job
        required: false
        type: string
        default: ai-pr-review-runtime
      no-pr-label:
        description: Label applied when no pull request is required
        required: false
        type: string
        default: codex:no-pr
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: xhigh
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Codex on Amazon Bedrock
        required: false
      CODEX_WORKFLOW_PUSH_TOKEN:
        description: Token allowed to push changes under .github/workflows
        required: false

permissions: {}

jobs:
  resolve:
    name: Resolve issue implementation
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/codex-work-item-resolver.yml
    with:
      work-scope: implementation
      requested-issue-number: ${{ inputs['issue-number'] || '' }}
      environment-name: >-
        ${{ inputs['environment-name'] || 'ai-pr-review-runtime' }}
      no-pr-label: >-
        ${{ inputs['no-pr-label'] || 'codex:no-pr' }}
      model: ${{ inputs['model'] || 'openai.gpt-5.6-sol' }}
      reasoning-effort: >-
        ${{ inputs['reasoning-effort'] || 'xhigh' }}
      allow-workflow-changes: >-
        ${{ inputs['allow-workflow-changes'] || false }}
      upload-work-items: false

  implement:
    name: Implement ${{ matrix.work_key }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/codex-issue-worker.yml
    with:
      issue-number: ${{ matrix.issue_number }}
      pull-request-number: ${{ matrix.pull_request_number }}
      address-only: ${{ matrix.address_only }}
      work-key: ${{ matrix.work_key }}
      publication-actor: >-
        ${{ needs.resolve.outputs.publication_actor }}
      environment-name: >-
        ${{ inputs['environment-name'] || 'ai-pr-review-runtime' }}
      no-pr-label: >-
        ${{ inputs['no-pr-label'] || 'codex:no-pr' }}
      model: ${{ inputs['model'] || 'openai.gpt-5.6-sol' }}
      reasoning-effort: >-
        ${{ inputs['reasoning-effort'] || 'xhigh' }}
      allow-workflow-changes: >-
        ${{ inputs['allow-workflow-changes'] || false }}
    secrets: inherit
