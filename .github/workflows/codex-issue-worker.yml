name: Codex Issue Worker

on:
  workflow_call:
    inputs:
      issue-number:
        description: Issue number, or zero for PR-scoped review work
        required: true
        type: number
      pull-request-number:
        description: Pull request number, or zero for issue-scoped work
        required: true
        type: number
      address-only:
        description: Restrict reconciliation to existing review feedback
        required: true
        type: boolean
      work-key:
        description: Stable issue or pull request concurrency key
        required: true
        type: string
      publication-actor:
        description: Automatic token actor used for idempotency markers
        required: true
        type: string
      no-pr-label:
        description: Label applied when no pull request is required
        required: true
        type: string
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: true
        type: string
      reasoning-effort:
        description: Codex reasoning effort
        required: true
        type: string
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: true
        type: boolean
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Codex on Amazon Bedrock
        required: false

permissions: {}

concurrency:
  group: >-
    codex-${{ github.repository_id }}-${{ inputs['work-key'] }}
  cancel-in-progress: false

env:
  DEFAULT_NO_PR_LABEL: codex:no-pr
  DEFAULT_CODEX_MODEL: openai.gpt-5.6-sol
  DEFAULT_REASONING_EFFORT: high

jobs:
  reconcile:
    name: Reconcile ${{ inputs['work-key'] }}
    runs-on: ubuntu-latest
    environment: ai-pr-review-runtime
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read

    steps:
      # Scripts and prompts are copied out of the worktree before the target
      # repository is checked out. Codex can read but cannot modify this copy.
      - name: Load trusted Codex implementation toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .codex-implementation-toolkit
          sparse-checkout: |
            .github/prompts/codex-issue-implementation.md
            .github/prompts/codex-issue-implementation-schema.json
            package.json
            package-lock.json
            scripts/codex_issue_implementation.py
            scripts/install_codex_cli.sh
            scripts/prepare_codex_implementation_user.sh
            scripts/serve_aws_credentials.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reserve trusted toolkit
        env:
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: |
          set -euo pipefail

          install -d -m 755 "$TOOLKIT_PATH"
          cp -R \
            .codex-implementation-toolkit/.github \
            .codex-implementation-toolkit/package.json \
            .codex-implementation-toolkit/package-lock.json \
            .codex-implementation-toolkit/scripts \
            "$TOOLKIT_PATH/"
          chmod -R a-w "$TOOLKIT_PATH"

      - name: Validate Codex implementation configuration
        id: config
        env:
          ADDRESS_ONLY: ${{ inputs['address-only'] }}
          ALLOW_WORKFLOW_CHANGES: >-
            ${{ inputs['allow-workflow-changes'] || false }}
          CODEX_MODEL: ${{ inputs['model'] || env.DEFAULT_CODEX_MODEL }}
          CODEX_REASONING_EFFORT: >-
            ${{ inputs['reasoning-effort'] ||
                env.DEFAULT_REASONING_EFFORT }}
          ISSUE_NUMBER: ${{ inputs['issue-number'] }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
          PULL_REQUEST_NUMBER: ${{ inputs['pull-request-number'] }}
          WORK_KEY: ${{ inputs['work-key'] }}
        run: |
          set -euo pipefail

          if [[ ! "$CODEX_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
            echo "::error::Codex model must be a non-empty model ID."
            exit 1
          fi

          case "$CODEX_REASONING_EFFORT" in
            none|minimal|low|medium|high|xhigh|max)
              ;;
            *)
              echo "::error::Unsupported Codex reasoning effort."
              exit 1
              ;;
          esac

          case "$ADDRESS_ONLY" in
            true)
              if [[ "$ISSUE_NUMBER" != "0" ||
                    ! "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ||
                    "$WORK_KEY" != "pr-$PULL_REQUEST_NUMBER" ]]; then
                echo "::error::Invalid PR-scoped work item."
                exit 1
              fi
              ;;
            false)
              if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ||
                    "$PULL_REQUEST_NUMBER" != "0" ||
                    "$WORK_KEY" != "issue-$ISSUE_NUMBER" ]]; then
                echo "::error::Invalid issue-scoped work item."
                exit 1
              fi
              ;;
            *)
              echo "::error::Address-only must be true or false."
              exit 1
              ;;
          esac

          if [[ -z "$NO_PR_LABEL" ]]; then
            echo "::error::No-PR label must be non-empty."
            exit 1
          fi

          {
            echo "model=$CODEX_MODEL"
            echo "reasoning_effort=$CODEX_REASONING_EFFORT"
            echo "allow_workflow_changes=$ALLOW_WORKFLOW_CHANGES"
          } >> "$GITHUB_OUTPUT"

      - name: Re-fetch issue and pull request state
        id: prepare
        env:
          ADDRESS_ONLY: ${{ inputs['address-only'] }}
          CODEX_PUBLISH_ACTOR: ${{ inputs['publication-actor'] }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs['issue-number'] }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
          PULL_REQUEST_NUMBER: ${{ inputs['pull-request-number'] }}
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: >-
          python3 "$TOOLKIT_PATH/scripts/codex_issue_implementation.py"
          prepare
          "${RUNNER_TEMP}/codex-implementation-state.json"
          "${RUNNER_TEMP}/codex-implementation-context.json"

      - name: Check out exact implementation target
        if: steps.prepare.outputs.run_model == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.prepare.outputs.target_repository }}
          ref: ${{ steps.prepare.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare unprivileged Codex user
        if: steps.prepare.outputs.run_model == 'true'
        env:
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: |
          set -euo pipefail

          bash "$TOOLKIT_PATH/scripts/prepare_codex_implementation_user.sh"

          current_userns="$(
            sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true
          )"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(
            sysctl -n kernel.apparmor_restrict_unprivileged_userns \
              2>/dev/null || true
          )"
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Node.js
        if: steps.prepare.outputs.run_model == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Codex CLI
        if: steps.prepare.outputs.run_model == 'true'
        env:
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: >-
          bash "$TOOLKIT_PATH/scripts/install_codex_cli.sh"
          "$TOOLKIT_PATH"

      - name: Configure AWS credentials for Codex
        if: steps.prepare.outputs.run_model == 'true'
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          role-session-name: >-
            codex-${{ inputs['work-key'] }}-${{ github.run_id }}
          aws-region: us-east-1
          inline-session-policy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": [
                  "bedrock-mantle:CreateInference",
                  "bedrock-mantle:GetProject",
                  "bedrock-mantle:ListProjects",
                  "bedrock-mantle:ListTagsForResources"
                ],
                "Resource": "*"
              }]
            }
          mask-aws-account-id: true
          output-credentials: true
          output-env-credentials: false

      - name: Implement current issue work with Codex
        if: steps.prepare.outputs.run_model == 'true'
        id: model
        env:
          ALLOW_WORKFLOW_CHANGES: >-
            ${{ steps.config.outputs.allow_workflow_changes == 'true' ||
                steps.prepare.outputs.command_allows_workflow_changes ==
                'true' }}
          AWS_ACCESS_KEY_ID: >-
            ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: >-
            ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: >-
            ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_CREDENTIAL_EXPIRATION: >-
            ${{ steps.aws-credentials.outputs.aws-expiration }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          CODEX_MODEL: ${{ steps.config.outputs.model }}
          CODEX_REASONING_EFFORT: >-
            ${{ steps.config.outputs.reasoning_effort }}
          TOOLKIT_PATH: ${{ runner.temp }}/codex-implementation-toolkit
        run: |
          set -euo pipefail

          codex_bin="$(command -v codex)"
          output_parent="${RUNNER_TEMP}/codex-implementation-output"
          sudo install \
            -d \
            -m 711 \
            -o root \
            -g root \
            "$output_parent"
          output_dir="${output_parent}/result"
          sudo install \
            -d \
            -m 750 \
            -o root \
            -g codex-implement \
            "$output_dir"
          output_file="${output_dir}/result.json"
          output_schema="${output_dir}/schema.json"
          prompt_file="${RUNNER_TEMP}/codex-implementation-prompt.md"
          trusted_instructions="${RUNNER_TEMP}/codex-trusted-instructions.json"
          credential_proxy_dir="${RUNNER_TEMP}/codex-credential-proxy"
          credential_port_file="${credential_proxy_dir}/port"
          credential_log="${credential_proxy_dir}/server.log"
          credential_proxy_pid=""
          trusted_prompt="${TOOLKIT_PATH}/.github/prompts/codex-issue-implementation.md"
          trusted_schema="${TOOLKIT_PATH}/.github/prompts/codex-issue-implementation-schema.json"
          cleanup() {
            if [[ -n "$credential_proxy_pid" ]]; then
              kill "$credential_proxy_pid" 2>/dev/null || true
              wait "$credential_proxy_pid" 2>/dev/null || true
            fi
            rm -rf "$credential_proxy_dir"
            sudo rm -rf "$output_parent"
          }
          trap cleanup EXIT

          python3 \
            "$TOOLKIT_PATH/scripts/codex_issue_implementation.py" \
            trusted-instructions \
            "${RUNNER_TEMP}/codex-implementation-state.json" \
            "$trusted_instructions" \
            "$GITHUB_WORKSPACE"

          {
            cat "$trusted_prompt"
            printf '\n\n%s\n' '```json'
            cat "$trusted_instructions"
            printf '%s\n' '```'
            printf '\n\n%s\n' 'Untrusted reconciliation context follows:'
            printf '\n\n%s\n' '```json'
            cat "${RUNNER_TEMP}/codex-implementation-context.json"
            printf '%s\n' '```'
          } > "$prompt_file"

          sudo install \
            -m 440 \
            -o root \
            -g codex-implement \
            "$trusted_schema" \
            "$output_schema"
          sudo install \
            -m 600 \
            -o codex-implement \
            -g codex-implement \
            /dev/null \
            "$output_file"

          install -d -m 700 "$credential_proxy_dir"
          credential_proxy_token="$(openssl rand -hex 32)"
          echo "::add-mask::$credential_proxy_token"
          CODEX_CREDENTIAL_PROXY_TOKEN="$credential_proxy_token" \
          python3 \
            "$TOOLKIT_PATH/scripts/serve_aws_credentials.py" \
            "$credential_port_file" \
            >"$credential_log" 2>&1 &
          credential_proxy_pid="$!"

          for _ in {1..100}; do
            if [[ -s "$credential_port_file" ]]; then
              break
            fi
            if ! kill -0 "$credential_proxy_pid" 2>/dev/null; then
              cat "$credential_log" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [[ ! -s "$credential_port_file" ]]; then
            echo "AWS credential proxy did not become ready" >&2
            exit 1
          fi
          credential_port="$(cat "$credential_port_file")"
          if [[ ! "$credential_port" =~ ^[0-9]+$ ]]; then
            echo "AWS credential proxy returned an invalid port" >&2
            exit 1
          fi
          credential_uri="http://127.0.0.1:${credential_port}/credentials"

          sudo -u codex-implement -- env -i \
            HOME=/home/codex-implement \
            PATH="$PATH" \
            "$codex_bin" \
            sandbox \
            --config 'sandbox_workspace_write.network_access=false' \
            --permission-profile :workspace \
            --cd "$GITHUB_WORKSPACE" \
            /usr/bin/true

          # A model tool that learns the proxy token must still be unable to
          # reach the runner-owned credential endpoint.
          if sudo -u codex-implement -- env -i \
            HOME=/home/codex-implement \
            PATH="$PATH" \
            "$codex_bin" \
            sandbox \
            --config 'sandbox_workspace_write.network_access=false' \
            --permission-profile :workspace \
            --cd "$GITHUB_WORKSPACE" \
            /usr/bin/curl \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: $credential_proxy_token" \
            "$credential_uri" \
            >/dev/null 2>&1; then
            echo "network-disabled model tools reached AWS credentials" >&2
            exit 1
          fi

          runtime_aws_access_key_id="$AWS_ACCESS_KEY_ID"
          runtime_aws_secret_access_key="$AWS_SECRET_ACCESS_KEY"
          runtime_aws_session_token="$AWS_SESSION_TOKEN"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

          # The runner intentionally opens stdin before sudo changes users.
          # shellcheck disable=SC2024
          sudo -u codex-implement -- env -i \
            AWS_CONTAINER_AUTHORIZATION_TOKEN="$credential_proxy_token" \
            AWS_CONTAINER_CREDENTIALS_FULL_URI="$credential_uri" \
            AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
            AWS_EC2_METADATA_DISABLED=true \
            AWS_REGION="$AWS_REGION" \
            CODEX_HOME=/home/codex-implement/.codex \
            GIT_OPTIONAL_LOCKS=0 \
            HOME=/home/codex-implement \
            LANG=C.UTF-8 \
            LOGNAME=codex-implement \
            PATH="$PATH" \
            SHELL=/bin/bash \
            USER=codex-implement \
            /usr/bin/timeout \
            --signal=TERM \
            --kill-after=30s \
            40m \
            "$codex_bin" \
            --ask-for-approval never \
            --sandbox workspace-write \
            --disable apps \
            --disable browser_use \
            --disable computer_use \
            --disable hooks \
            --disable image_generation \
            --disable multi_agent \
            --disable plugins \
            --disable view_image \
            --strict-config \
            --model "$CODEX_MODEL" \
            --config \
              "model_reasoning_effort=\"${CODEX_REASONING_EFFORT}\"" \
            --config 'model_provider="amazon-bedrock"' \
            --config 'web_search="disabled"' \
            --config 'project_doc_max_bytes=0' \
            --config 'allow_login_shell=false' \
            --config 'history.persistence="none"' \
            --config 'sandbox_workspace_write.network_access=false' \
            --config 'sandbox_workspace_write.exclude_slash_tmp=true' \
            --config \
              'sandbox_workspace_write.exclude_tmpdir_env_var=true' \
            --config 'shell_environment_policy.inherit="core"' \
            --config \
              'shell_environment_policy.set={HOME="/home/codex-implement",GIT_OPTIONAL_LOCKS="0"}' \
            --config \
              'shell_environment_policy.exclude=["AWS_*","GH_*","GITHUB_*"]' \
            exec \
            --ignore-user-config \
            --ignore-rules \
            --cd "$GITHUB_WORKSPACE" \
            --output-last-message "$output_file" \
            --output-schema "$output_schema" \
            --color never \
            --ephemeral \
            - < "$prompt_file"

          sudo install \
            -m 600 \
            -o runner \
            -g runner \
            "$output_file" \
            "${RUNNER_TEMP}/codex-implementation-result.json"

          sudo chown -R runner:runner "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX,go-rwx "$GITHUB_WORKSPACE"

          export AWS_ACCESS_KEY_ID="$runtime_aws_access_key_id"
          export AWS_SECRET_ACCESS_KEY="$runtime_aws_secret_access_key"
          export AWS_SESSION_TOKEN="$runtime_aws_session_token"
          export AWS_CONTAINER_AUTHORIZATION_TOKEN="$credential_proxy_token"
          export CODEX_CREDENTIAL_PROXY_TOKEN="$credential_proxy_token"
          python3 "$TOOLKIT_PATH/scripts/codex_issue_implementation.py" \
            validate-model \
            "${RUNNER_TEMP}/codex-implementation-result.json" \
            "${RUNNER_TEMP}/codex-implementation-state.json" \
            "${RUNNER_TEMP}/codex-implementation-artifact.json" \
            "${RUNNER_TEMP}/codex-implementation.patch" \
            "$GITHUB_WORKSPACE"
          unset \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            AWS_SESSION_TOKEN \
            AWS_CONTAINER_AUTHORIZATION_TOKEN \
            CODEX_CREDENTIAL_PROXY_TOKEN

      - name: Upload validated publication bundle
        if: >-
          always() &&
          steps.prepare.outcome == 'success' &&
          (
            steps.prepare.outputs.run_model != 'true' ||
            steps.model.outcome == 'success'
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-implementation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs['work-key'] }}
          path: |
            ${{ runner.temp }}/codex-implementation-state.json
            ${{ runner.temp }}/codex-implementation-artifact.json
            ${{ runner.temp }}/codex-implementation.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ inputs['work-key'] }}
    needs: reconcile
    if: >-
      always() &&
      needs.reconcile.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Load trusted publication toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .codex-publication-toolkit
          sparse-checkout: scripts/codex_issue_implementation.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reserve trusted publication toolkit
        env:
          TOOLKIT_PATH: ${{ runner.temp }}/codex-publication-toolkit
        run: |
          set -euo pipefail

          install -d -m 755 "$TOOLKIT_PATH/scripts"
          cp \
            .codex-publication-toolkit/scripts/codex_issue_implementation.py \
            "$TOOLKIT_PATH/scripts/"
          chmod -R a-w "$TOOLKIT_PATH"

      - name: Download validated publication bundle
        id: download
        if: needs.reconcile.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-implementation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs['work-key'] }}
          path: ${{ runner.temp }}/codex-publication

      - name: Resolve publication plan
        id: plan
        if: steps.download.outcome == 'success'
        env:
          TOOLKIT_PATH: ${{ runner.temp }}/codex-publication-toolkit
        run: >-
          python3 "$TOOLKIT_PATH/scripts/codex_issue_implementation.py"
          publication-plan
          "${RUNNER_TEMP}/codex-publication/codex-implementation-state.json"
          "${RUNNER_TEMP}/codex-publication/codex-implementation-artifact.json"
          "${RUNNER_TEMP}/codex-publication/codex-implementation.patch"

      - name: Check out exact publication target
        if: >-
          steps.download.outcome == 'success' &&
          steps.plan.outputs.checkout == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.plan.outputs.target_repository }}
          ref: ${{ steps.plan.outputs.target_sha }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Revalidate and publish with event-suppressing token
        if: >-
          steps.download.outcome == 'success' &&
          steps.plan.outputs.action != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs['issue-number'] }}
          NO_PR_LABEL: >-
            ${{ inputs['no-pr-label'] || env.DEFAULT_NO_PR_LABEL }}
          PULL_REQUEST_NUMBER: ${{ inputs['pull-request-number'] }}
          TOOLKIT_PATH: ${{ runner.temp }}/codex-publication-toolkit
        run: >-
          python3 "$TOOLKIT_PATH/scripts/codex_issue_implementation.py"
          publish
          "${RUNNER_TEMP}/codex-publication/codex-implementation-state.json"
          "${RUNNER_TEMP}/codex-publication/codex-implementation-artifact.json"
          "${RUNNER_TEMP}/codex-publication/codex-implementation.patch"
          "$GITHUB_WORKSPACE"
