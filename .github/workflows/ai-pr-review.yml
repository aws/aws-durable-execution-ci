name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      prompt-path:
        description: Optional prompt file relative to the caller repository
        required: false
        type: string
        default: ""
      run-claude:
        description: Run the Claude pull request review
        required: false
        type: boolean
        default: true
      run-codex:
        description: Run the Codex pull request review
        required: false
        type: boolean
        default: true
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke the AI review models
        required: false

permissions: {}

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve_review:
    name: Approve AI PR review
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.draft ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: ai-pr-review
    permissions: {}
    steps:
      - name: Record approval
        run: echo "Approved review of ${{ github.event.pull_request.head.sha }}"

  # Direct pull_request_target runs have no workflow_call inputs. Formatting
  # distinguishes a missing value from an explicit false supplied by a caller.
  claude-review:
    name: Claude review
    needs: approve_review
    if: >-
      always() &&
      format('{0}', inputs['run-claude']) != 'false' &&
      (
        (
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        needs.approve_review.result == 'success'
      )
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/claude-review.yml
    with:
      prompt-path: ${{ inputs['prompt-path'] }}
    secrets: inherit

  codex-review:
    name: Codex review
    needs: approve_review
    if: >-
      always() &&
      format('{0}', inputs['run-codex']) != 'false' &&
      (
        (
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        needs.approve_review.result == 'success'
      )
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/codex-review.yml
    with:
      prompt-path: ${{ inputs['prompt-path'] }}
    secrets: inherit
