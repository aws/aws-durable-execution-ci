name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      prompt-path:
        description: Optional prompt file relative to the caller repository
        required: false
        type: string
        default: ""
      run-claude:
        description: Run the Claude pull request review
        required: false
        type: boolean
        default: true
      run-codex:
        description: Run the Codex pull request review
        required: false
        type: boolean
        default: true
      claude-model:
        description: Claude model ID to use through Amazon Bedrock
        required: false
        type: string
        default: us.anthropic.claude-sonnet-5
      claude-reasoning-effort:
        description: Claude reasoning effort
        required: false
        type: string
        default: xhigh
      codex-model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      codex-reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: xhigh
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke the AI review models
        required: false

permissions: {}

jobs:
  resolve_review:
    name: Resolve AI PR review
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/ai') &&
        contains(github.event.comment.body, 'review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review-requested: ${{ steps.resolve.outputs.review-requested }}
      pull-request-number: ${{ steps.resolve.outputs.pull-request-number }}
      base-sha: ${{ steps.resolve.outputs.base-sha }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
    steps:
      - name: Check out AI review toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-toolkit
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve review request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .ai-review-toolkit/scripts/resolve_ai_review.py

  # Direct event runs have no workflow_call inputs. Formatting distinguishes a
  # missing value from an explicit false supplied by a caller.
  claude-review:
    name: Claude review
    needs: resolve_review
    if: >-
      needs.resolve_review.outputs.review-requested == 'true' &&
      format('{0}', inputs['run-claude']) != 'false'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/claude-review.yml
    with:
      pull-request-number: >-
        ${{ needs.resolve_review.outputs.pull-request-number }}
      base-sha: ${{ needs.resolve_review.outputs.base-sha }}
      head-sha: ${{ needs.resolve_review.outputs.head-sha }}
      prompt-path: ${{ inputs['prompt-path'] }}
      model: ${{ inputs['claude-model'] || 'us.anthropic.claude-sonnet-5' }}
      reasoning-effort: ${{ inputs['claude-reasoning-effort'] || 'xhigh' }}
    secrets: inherit

  codex-review:
    name: Codex review
    needs: resolve_review
    if: >-
      needs.resolve_review.outputs.review-requested == 'true' &&
      format('{0}', inputs['run-codex']) != 'false'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/codex-review.yml
    with:
      pull-request-number: >-
        ${{ needs.resolve_review.outputs.pull-request-number }}
      base-sha: ${{ needs.resolve_review.outputs.base-sha }}
      head-sha: ${{ needs.resolve_review.outputs.head-sha }}
      prompt-path: ${{ inputs['prompt-path'] }}
      model: ${{ inputs['codex-model'] || 'openai.gpt-5.6-sol' }}
      reasoning-effort: ${{ inputs['codex-reasoning-effort'] || 'xhigh' }}
    secrets: inherit
