name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      prompt-path:
        description: Optional prompt file relative to the caller repository
        required: false
        type: string
        default: ""
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke the AI review models
        required: false

permissions: {}

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve_review:
    name: Approve AI PR review
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.draft ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: ai-pr-review
    permissions: {}
    steps:
      - name: Record approval
        run: echo "Approved review of ${{ github.event.pull_request.head.sha }}"

  claude-review:
    name: Generate Claude review
    needs: approve_review
    if: >-
      always() &&
      (
        (
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        needs.approve_review.result == 'success'
      )
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/claude-review.yml
    with:
      prompt-path: ${{ inputs['prompt-path'] }}
    secrets: inherit

  claude-review-comment:
    name: Post Claude review
    needs: claude-review
    if: >-
      always() &&
      needs.claude-review.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/claude-review-comment.yml

  codex-review:
    name: Generate Codex review
    needs: approve_review
    if: >-
      always() &&
      (
        (
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        needs.approve_review.result == 'success'
      )
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/codex-review.yml
    with:
      prompt-path: ${{ inputs['prompt-path'] }}
    secrets: inherit

  codex-review-comment:
    name: Post Codex review
    needs: codex-review
    if: >-
      always() &&
      needs.codex-review.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/codex-review-comment.yml
