name: Notify Slack

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, reopened]
  discussion:
    types: [created]
  release:
    types: [published]
  workflow_call:
    inputs:
      model:
        description: Codex model ID used through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-luna
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Codex on Amazon Bedrock
        required: false
      SLACK_WEBHOOK_URL_PR:
        description: Incoming webhook for pull request notifications
        required: true
      SLACK_WEBHOOK_URL_ISSUE:
        description: Incoming webhook for issue notifications
        required: true
      SLACK_WEBHOOK_URL_DISCUSSION:
        description: Incoming webhook for discussion notifications
        required: false
      SLACK_WEBHOOK_URL_RELEASE:
        description: Incoming webhook for release notifications
        required: true

permissions: {}

jobs:
  summarize:
    name: Generate notification summary
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: ai-pr-review-runtime
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    permissions:
      contents: read
      id-token: write
    env:
      BEDROCK_ROLE_ARN: ${{ secrets.BEDROCK_ROLE_ARN }}
    steps:
      - name: Validate notification summary configuration
        id: summary-config
        env:
          SUMMARY_MODEL: ${{ inputs['model'] || 'openai.gpt-5.6-luna' }}
        run: |
          set -euo pipefail

          if [[ ! "$SUMMARY_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
            echo "::error::Notification summary model must be a non-empty model ID."
            exit 1
          fi

          echo "model=$SUMMARY_MODEL" >> "$GITHUB_OUTPUT"

      # Load only trusted support code from the immutable workflow revision.
      # Pull request and caller repository code are never checked out.
      - name: Check out notification toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .notification-toolkit
          sparse-checkout: |
            scripts/prepare_ai_summary_user.sh
            scripts/summarize_notification.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare notification summary input
        run: >-
          python3
          .notification-toolkit/scripts/summarize_notification.py
          prepare
          "${RUNNER_TEMP}/notification-summary"

      - name: Prepare unprivileged Codex user
        if: env.BEDROCK_ROLE_ARN != ''
        run: bash .notification-toolkit/scripts/prepare_ai_summary_user.sh

      - name: Set up Node.js
        if: env.BEDROCK_ROLE_ARN != ''
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Install Codex CLI
        if: env.BEDROCK_ROLE_ARN != ''
        run: npm install -g "@openai/codex@0.147.0"

      - name: Configure AWS credentials for Codex
        if: env.BEDROCK_ROLE_ARN != ''
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ env.BEDROCK_ROLE_ARN }}
          role-session-name: codex-notification-summary-${{ github.run_id }}
          aws-region: us-east-1
          inline-session-policy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": [
                  "bedrock-mantle:CreateInference",
                  "bedrock-mantle:GetProject",
                  "bedrock-mantle:ListProjects",
                  "bedrock-mantle:ListTagsForResources"
                ],
                "Resource": "*"
              }]
            }
          mask-aws-account-id: true
          output-credentials: true
          output-env-credentials: false

      - name: Generate concise notification summary
        if: >-
          env.BEDROCK_ROLE_ARN != '' &&
          steps.aws-credentials.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          SUMMARY_MODEL: ${{ steps.summary-config.outputs.model }}
        run: |
          set -euo pipefail

          codex_bin="$(command -v codex)"
          summary_dir="${RUNNER_TEMP}/notification-summary"
          prompt_file="${summary_dir}/prompt.txt"
          context_file="${summary_dir}/context.json"
          output_dir="$(
            sudo -u codex-summary mktemp -d -t codex-notification-summary.XXXXXX
          )"
          model_output="${output_dir}/summary.txt"
          trap 'sudo rm -rf "$output_dir"' EXIT

          trusted_prompt="$(cat "$prompt_file")"
          cd /tmp
          sudo -u codex-summary -- sh -c '
            : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID was not preserved by sudo}"
            : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY was not preserved by sudo}"
            : "${AWS_SESSION_TOKEN:?AWS_SESSION_TOKEN was not preserved by sudo}"
            : "${AWS_REGION:?AWS_REGION was not preserved by sudo}"
          '

          sudo -u codex-summary -- timeout \
            --signal=TERM \
            --kill-after=15s \
            2m \
            env \
            CODEX_HOME=/home/codex-summary/.codex \
            "$codex_bin" \
            --ask-for-approval never \
            --sandbox read-only \
            --disable apps \
            --disable browser_use \
            --disable computer_use \
            --disable hooks \
            --disable image_generation \
            --disable multi_agent \
            --disable plugins \
            --disable shell_tool \
            --disable unified_exec \
            --disable view_image \
            --strict-config \
            --model "$SUMMARY_MODEL" \
            --config 'model_reasoning_effort="low"' \
            --config 'model_provider="amazon-bedrock"' \
            --config 'default_permissions=":read-only"' \
            --config 'web_search="disabled"' \
            --config 'allow_login_shell=false' \
            --config 'history.persistence="none"' \
            --config 'shell_environment_policy.inherit="none"' \
            exec \
            --ignore-user-config \
            --ignore-rules \
            --skip-git-repo-check \
            --cd "$output_dir" \
            --output-last-message "$model_output" \
            --color never \
            --ephemeral \
            "$trusted_prompt" < "$context_file"

          sudo install \
            -m 600 \
            -o runner \
            -g runner \
            "$model_output" \
            "${summary_dir}/raw-summary.txt"

      - name: Finalize notification summary
        if: always()
        id: summary
        run: >-
          python3
          .notification-toolkit/scripts/summarize_notification.py
          finalize
          "${RUNNER_TEMP}/notification-summary/raw-summary.txt"

  notify-pr:
    name: Notify Slack - Pull Requests
    needs: summarize
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send pull request notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PR }}
          webhook-type: incoming-webhook
          payload: |
            {
              "action": ${{ toJSON(github.event.action) }},
              "pr_url": ${{ toJSON(github.event.pull_request.html_url) }},
              "package_name": ${{ toJSON(github.repository) }},
              "summary": ${{ toJSON(needs.summarize.outputs.summary || 'New pull request activity.') }}
            }

  notify-issues:
    name: Notify Slack - Issues
    needs: summarize
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send issue notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_ISSUE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "action": ${{ toJSON(github.event.action) }},
              "issue_url": ${{ toJSON(github.event.issue.html_url) }},
              "package_name": ${{ toJSON(github.repository) }},
              "summary": ${{ toJSON(needs.summarize.outputs.summary || 'New issue activity.') }}
            }

  notify-discussions:
    name: Notify Slack - Discussions
    needs: summarize
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'discussion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send discussion notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_DISCUSSION }}
          webhook-type: incoming-webhook
          payload: |
            {
              "action": ${{ toJSON(github.event.action) }},
              "discussion_url": ${{ toJSON(github.event.discussion.html_url) }},
              "package_name": ${{ toJSON(github.repository) }},
              "summary": ${{ toJSON(needs.summarize.outputs.summary || 'New discussion activity.') }}
            }

  notify-release:
    name: Notify Slack - Release
    needs: summarize
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send release notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_RELEASE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "tag_name": ${{ toJSON(github.event.release.tag_name) }},
              "release_url": ${{ toJSON(github.event.release.html_url) }},
              "package_name": ${{ toJSON(github.repository) }},
              "summary": ${{ toJSON(needs.summarize.outputs.summary || 'New release activity.') }}
            }
