name: Notify Slack

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL_PR:
        description: Incoming webhook for pull request notifications
        required: true
      SLACK_WEBHOOK_URL_ISSUE:
        description: Incoming webhook for issue notifications
        required: true
      SLACK_WEBHOOK_URL_DISCUSSION:
        description: Incoming webhook for discussion notifications
        required: false
      SLACK_WEBHOOK_URL_RELEASE:
        description: Incoming webhook for release notifications
        required: true

permissions: {}

jobs:
  notify-pr:
    name: Notify Slack - Pull Requests
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Send pull request notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PR }}
          webhook-type: incoming-webhook
          payload: |
            {
              "action": ${{ toJSON(github.event.action) }},
              "pr_url": ${{ toJSON(github.event.pull_request.html_url) }},
              "package_name": ${{ toJSON(github.repository) }}
            }

  notify-issues:
    name: Notify Slack - Issues
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Send issue notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_ISSUE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "action": ${{ toJSON(github.event.action) }},
              "issue_url": ${{ toJSON(github.event.issue.html_url) }},
              "package_name": ${{ toJSON(github.repository) }}
            }

  notify-discussions:
    name: Notify Slack - Discussions
    if: github.event_name == 'discussion'
    runs-on: ubuntu-latest
    steps:
      - name: Send discussion notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_DISCUSSION }}
          webhook-type: incoming-webhook
          payload: |
            {
              "action": ${{ toJSON(github.event.action) }},
              "discussion_url": ${{ toJSON(github.event.discussion.html_url) }},
              "package_name": ${{ toJSON(github.repository) }}
            }

  notify-release:
    name: Notify Slack - Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Send release notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_RELEASE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "tag_name": ${{ toJSON(github.event.release.tag_name) }},
              "release_url": ${{ toJSON(github.event.release.html_url) }},
              "package_name": ${{ toJSON(github.repository) }}
            }
