name: AI PR Review Address

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows:
      - AI PR Review Address
    types: [completed]
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Pull request number with authorized feedback
        required: true
        type: string
  workflow_call:
    inputs:
      pull-request-number:
        description: Optional pull request number with authorized feedback
        required: false
        type: string
        default: ""
      source-run-id:
        description: Optional intake workflow run ID
        required: false
        type: string
        default: ""
      source-run-attempt:
        description: Optional intake workflow run attempt
        required: false
        type: string
        default: ""
      environment-name:
        description: GitHub environment used for the model job
        required: false
        type: string
        default: ai-pr-review-runtime
      no-pr-label:
        description: Label used by the shared Codex worker
        required: false
        type: string
        default: codex:no-pr
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: xhigh
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Codex on Amazon Bedrock
        required: false
      CODEX_WORKFLOW_PUSH_TOKEN:
        description: Token allowed to push changes under .github/workflows
        required: false

permissions: {}

jobs:
  resolve:
    name: Resolve PR review feedback
    if: github.event_name != 'workflow_run'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/ai-work-item-resolver.yml
    with:
      work-scope: review
      requested-pull-request-number: >-
        ${{ inputs['pull-request-number'] || '' }}
      no-pr-label: >-
        ${{ inputs['no-pr-label'] || 'codex:no-pr' }}
      upload-work-items: >-
        ${{ github.event_name == 'pull_request_review_comment' }}

  load:
    name: Validate authorized PR review work
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event ==
        'pull_request_review_comment' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      count: ${{ steps.validate.outputs.count }}
      matrix: ${{ steps.validate.outputs.matrix }}
      publication_actor: ${{ steps.publisher.outputs.publish_actor }}

    steps:
      - name: Validate continuation identity
        env:
          EXPECTED_RUN_ATTEMPT: >-
            ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUESTED_RUN_ATTEMPT: ${{ inputs['source-run-attempt'] }}
          REQUESTED_RUN_ID: ${{ inputs['source-run-id'] }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_RUN_ID" &&
                "$REQUESTED_RUN_ID" != "$EXPECTED_RUN_ID" ]]; then
            echo "::error::Source run ID does not match the workflow_run event."
            exit 1
          fi
          if [[ -n "$REQUESTED_RUN_ATTEMPT" &&
                "$REQUESTED_RUN_ATTEMPT" != "$EXPECTED_RUN_ATTEMPT" ]]; then
            echo "::error::Source run attempt does not match the workflow_run event."
            exit 1
          fi

      - name: Load trusted reconciliation toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts/codex_issue_implementation.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download authorized PR review work
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            codex-review-work-items-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/codex-pr-review-reconciliation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate authorized PR review work
        id: validate
        env:
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_RUN_ATTEMPT: >-
            ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORK_SCOPE: review
        run: >-
          python3 scripts/codex_issue_implementation.py
          validate-work-items
          "${RUNNER_TEMP}/codex-pr-review-reconciliation/codex-work-items.json"

      - name: Resolve publication actor
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_actor="$(
            gh api graphql \
              --field query='query { viewer { login } }' \
              --jq '.data.viewer.login'
          )"
          if [[ ! "$publish_actor" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]]; then
            echo "::error::Could not resolve the automatic token actor."
            exit 1
          fi
          echo "publish_actor=$publish_actor" >> "$GITHUB_OUTPUT"

  address:
    name: Address ${{ matrix.work_key }}
    needs: [resolve, load]
    if: >-
      always() &&
      github.event_name != 'pull_request_review_comment' &&
      (
        needs.resolve.result == 'success' ||
        needs.load.result == 'success'
      ) &&
      (
        needs.resolve.outputs.count ||
        needs.load.outputs.count
      ) != '0'
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          needs.resolve.outputs.matrix ||
          needs.load.outputs.matrix
        ) }}
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/codex-issue-worker.yml
    with:
      issue-number: ${{ matrix.issue_number }}
      pull-request-number: ${{ matrix.pull_request_number }}
      address-only: ${{ matrix.address_only }}
      work-key: ${{ matrix.work_key }}
      publication-actor: >-
        ${{ needs.resolve.outputs.publication_actor ||
            needs.load.outputs.publication_actor }}
      environment-name: >-
        ${{ inputs['environment-name'] || 'ai-pr-review-runtime' }}
      no-pr-label: >-
        ${{ inputs['no-pr-label'] || 'codex:no-pr' }}
      model: ${{ inputs['model'] || 'openai.gpt-5.6-sol' }}
      reasoning-effort: >-
        ${{ inputs['reasoning-effort'] || 'xhigh' }}
      allow-workflow-changes: >-
        ${{ inputs['allow-workflow-changes'] || false }}
    secrets: inherit
