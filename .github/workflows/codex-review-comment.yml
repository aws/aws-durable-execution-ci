name: Post Codex PR Review

on:
  workflow_call:

permissions: {}

jobs:
  post:
    name: Post Codex review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download Codex review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-review-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-review

      # Load the posting script from the same immutable revision as this
      # workflow. No pull request code is checked out or executed.
      - name: Check out AI review toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-toolkit
          sparse-checkout: scripts
          persist-credentials: false

      - name: Post Codex review
        env:
          CODEX_REVIEW_FILE: ${{ runner.temp }}/codex-review/codex-review.json
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          CODEX_REVIEW="$(
            jq -ser '
              select(length == 1) |
              .[0] |
              select(type == "object" and keys == ["summary"]) |
              .summary |
              select(
                type == "string" and
                length <= 4000 and
                test("[^[:space:]]")
              )
            ' "$CODEX_REVIEW_FILE"
          )"
          CODEX_REVIEW="$(
            sed -E \
              -e '1{/^## (Claude|Codex) AI review$/d;}' \
              -e '/[^[:space:]]/,$!d' \
              <<< "$CODEX_REVIEW"
          )"
          if [[ -z "${CODEX_REVIEW//[[:space:]]/}" ]]; then
            echo "::error::Codex returned an empty review."
            exit 1
          fi

          summary_file="${RUNNER_TEMP}/codex-review-summary.md"
          printf '%s' "$CODEX_REVIEW" > "$summary_file"
          bash .ai-review-toolkit/scripts/post_ai_review_summary.sh \
            codex \
            "$EXPECTED_HEAD_SHA" \
            "$summary_file"
