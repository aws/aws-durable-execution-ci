name: PR Status Labels

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for every job in this workflow
        required: false
        type: string
        default: ubuntu-latest

permissions: {}

# No concurrency group: each run decides from its own event time and the
# current labels, and every change is idempotent. A group would cancel a
# pending run, and with it that event, when a newer event arrives.

jobs:
  update:
    name: Update PR status labels
    # pull_request_target gives the token write access on fork pull requests.
    # The job never checks out pull request code. Pushes by anyone but the
    # author, and pushes to a pull request without changes-requested, skip
    # the job.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review' ||
        (
          github.event.action == 'synchronize' &&
          github.event.sender.login == github.event.pull_request.user.login &&
          contains(github.event.pull_request.labels.*.name, 'changes-requested')
        )
      )
    runs-on: ${{ inputs['runs-on'] || 'ubuntu-latest' }}
    timeout-minutes: 5
    # pull-requests: write also covers creating and applying labels.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out PR status label toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use job.workflow_* so reusable calls fetch this workflow repo's
          # script, not caller-owned code.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts/pr_status_labels.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Update status labels
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: python3 scripts/pr_status_labels.py
