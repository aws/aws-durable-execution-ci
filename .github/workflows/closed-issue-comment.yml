name: Closed Issue Comment

on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for every job in this workflow
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      SLACK_WEBHOOK_URL_ISSUE:
        description: Incoming webhook for issue notifications
        required: true

permissions: {}

jobs:
  notify:
    name: Notify Slack - Closed issue comment
    # Only new comments from outside users on closed issues. Pull request
    # comments also arrive as issue_comment events and are skipped.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.state == 'closed' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ${{ inputs['runs-on'] || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send closed issue comment notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_ISSUE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "action": "commented_on_closed",
              "issue_url": ${{ toJSON(github.event.comment.html_url) }},
              "package_name": ${{ toJSON(github.repository) }},
              "summary": ${{ toJSON(format('New comment on closed issue #{0} by {1}.', github.event.issue.number, github.event.comment.user.login)) }}
            }
