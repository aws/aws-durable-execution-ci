name: Post Claude PR Review

on:
  workflow_call:

permissions: {}

jobs:
  post:
    name: Post Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download Claude review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-review-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-review

      # Load the posting script from the same immutable revision as this
      # workflow. No pull request code is checked out or executed.
      - name: Check out AI review toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-toolkit
          sparse-checkout: scripts
          persist-credentials: false

      - name: Post Claude review
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FILE: ${{ runner.temp }}/claude-review/claude-review.json
        run: |
          bash .ai-review-toolkit/scripts/post_ai_review.sh \
            claude \
            "$EXPECTED_BASE_SHA" \
            "$EXPECTED_HEAD_SHA" \
            "$REVIEW_FILE"
