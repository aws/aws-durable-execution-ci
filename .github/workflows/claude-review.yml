name: Claude PR Review

on:
  workflow_call:
    inputs:
      pull-request-number:
        description: Pull request number to review
        required: true
        type: string
      base-sha:
        description: Expected pull request base revision
        required: true
        type: string
      head-sha:
        description: Expected pull request head revision
        required: true
        type: string
      review-guidance-base64:
        description: Base64-encoded guidance from an authorized review command
        required: false
        type: string
        default: ""
      trigger-metadata-base64:
        description: Base64-encoded immutable GitHub trigger metadata
        required: false
        type: string
        default: ""
      prompt-path:
        description: Optional prompt file relative to the caller repository
        required: false
        type: string
        default: ""
      environment-name:
        description: GitHub environment used for the model job
        required: false
        type: string
        default: ai-pr-review-runtime
      model:
        description: Claude model ID to use through Amazon Bedrock
        required: false
        type: string
        default: us.anthropic.claude-sonnet-5
      reasoning-effort:
        description: Claude reasoning effort
        required: false
        type: string
        default: xhigh
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Claude on Amazon Bedrock
        required: false

permissions: {}

concurrency:
  group: >-
    ai-pr-review-claude-${{ github.repository_id }}-${{
      inputs['pull-request-number']
    }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Claude review
    runs-on: ubuntu-latest
    environment: >-
      ${{ inputs['environment-name'] || 'ai-pr-review-runtime' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Validate Claude review configuration
        id: review-config
        env:
          CLAUDE_MODEL: ${{ inputs['model'] }}
          CLAUDE_REASONING_EFFORT: ${{ inputs['reasoning-effort'] }}
        run: |
          set -euo pipefail

          if [[ ! "$CLAUDE_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
            echo "::error::Claude model must be a non-empty model ID."
            exit 1
          fi

          case "$CLAUDE_REASONING_EFFORT" in
            low|medium|high|xhigh|max)
              ;;
            *)
              echo "::error::Claude reasoning effort must be low, medium, high, xhigh, or max."
              exit 1
              ;;
          esac

          echo "model=$CLAUDE_MODEL" >> "$GITHUB_OUTPUT"
          echo "reasoning_effort=$CLAUDE_REASONING_EFFORT" >> "$GITHUB_OUTPUT"

      # pull_request_target exposes repository secrets, so only check out the
      # exact trusted base revision. The PR's code is never checked out.
      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs['base-sha'] }}

      - name: Reserve AI review toolkit path
        run: |
          if [[ -e .ai-review-toolkit ]]; then
            echo "::error::The trusted base contains the reserved AI review toolkit path."
            exit 1
          fi

      # Load support files from the same immutable revision as this workflow.
      - name: Check out AI review toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-toolkit
          sparse-checkout: |
            .github/prompts
            scripts
          persist-credentials: false

      - name: Resolve AI review prompt
        id: review-prompt
        env:
          CUSTOM_PROMPT_PATH: ${{ inputs['prompt-path'] }}
          REVIEW_GUIDANCE_BASE64: ${{ inputs['review-guidance-base64'] }}
        run: |
          prompt_path="$(
            bash .ai-review-toolkit/scripts/resolve_ai_review_prompt.sh \
              "$CUSTOM_PROMPT_PATH" \
              "$REVIEW_GUIDANCE_BASE64"
          )"
          echo "path=$prompt_path" >> "$GITHUB_OUTPUT"

      - name: Prepare pull request review context
        env:
          EXPECTED_BASE_SHA: ${{ inputs['base-sha'] }}
          EXPECTED_HEAD_SHA: ${{ inputs['head-sha'] }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs['pull-request-number'] }}
          REVIEWER: claude
        run: bash .ai-review-toolkit/scripts/prepare_ai_review_context.sh

      - name: Prepare review inputs
        id: review-inputs
        env:
          REVIEW_PROMPT_PATH: ${{ steps.review-prompt.outputs.path }}
        run: |
          delimiter="AI_REVIEW_PROMPT_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "prompt<<$delimiter"
            cat "$REVIEW_PROMPT_PATH"
            echo "$delimiter"
            echo "schema=$(jq -c . .ai-review-toolkit/.github/prompts/ai-pr-review-schema.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare unprivileged Claude user
        run: |
          bash .ai-review-toolkit/scripts/prepare_ai_review_user.sh claude-review

          # The Claude CLI runs through sudo. Preserve only its Bedrock
          # credentials and the action's subprocess-isolation controls.
          sudo sh -c \
            'printf "%s\n" \
              "Defaults:runner env_keep += \"AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION AWS_BEARER_TOKEN_BEDROCK\"" \
              "Defaults:runner env_keep += \"ANTHROPIC_BEDROCK_BASE_URL CLAUDE_CODE_USE_BEDROCK CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION CLAUDE_CODE_ATTRIBUTION_HEADER\"" \
              "Defaults:runner env_keep += \"CLAUDE_CODE_SUBPROCESS_ENV_SCRUB CLAUDE_CODE_SCRIPT_CAPS DETAILED_PERMISSION_MESSAGES\"" \
              > /etc/sudoers.d/claude-review-env'
          sudo chmod 440 /etc/sudoers.d/claude-review-env
          sudo visudo -cf /etc/sudoers.d/claude-review-env

      - name: Configure AWS credentials for Claude
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          role-session-name: claude-pr-review-${{ github.run_id }}
          aws-region: us-east-1
          inline-session-policy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": [
                  "bedrock:InvokeModel",
                  "bedrock:InvokeModelWithResponseStream"
                ],
                "Resource": "*"
              }]
            }
          mask-aws-account-id: true
          output-env-credentials: true

      - name: Review pull request with Claude on Amazon Bedrock
        id: review
        uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1.0.199
        env:
          AWS_REGION: us-east-1
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          path_to_claude_code_executable: ${{ github.workspace }}/.ai-review-toolkit/scripts/run_claude_isolated.sh
          # This also keeps the token out of the git remote configured by the action.
          allowed_non_write_users: ${{ github.actor }}
          allowed_bots: dependabot
          classify_inline_comments: "false"
          prompt: ${{ steps.review-inputs.outputs.prompt }}
          claude_args: |
            --model ${{ steps.review-config.outputs.model }}
            --effort ${{ steps.review-config.outputs.reasoning_effort }}
            --max-turns 20
            --bare
            --tools "Read,Grep,Glob"
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch"
            --json-schema '${{ steps.review-inputs.outputs.schema }}'

      - name: Save Claude review
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail

          if [[ ! -r "$CLAUDE_EXECUTION_FILE" ]]; then
            echo "::error::Claude execution output is not readable."
            exit 1
          fi

          jq -e '
            [
              .[]
              | select(.type == "result" and has("structured_output"))
              | .structured_output
            ] as $reviews
            | if (
                ($reviews | length) == 1 and
                ($reviews[0] | type == "object" and keys == ["comments", "summary"])
              ) then
                $reviews[0]
            else
              error("Claude returned invalid structured review output")
            end
          ' "$CLAUDE_EXECUTION_FILE" > "${RUNNER_TEMP}/claude-review.json"

      - name: Upload Claude review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-review.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  post:
    name: Post Claude review
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Download Claude review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-review-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-review

      # Load the posting script from the same immutable revision as this
      # workflow. No pull request code is checked out or executed.
      - name: Check out AI review toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-toolkit
          sparse-checkout: scripts
          persist-credentials: false

      - name: Post Claude review
        env:
          EXPECTED_BASE_SHA: ${{ inputs['base-sha'] }}
          EXPECTED_HEAD_SHA: ${{ inputs['head-sha'] }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PROMPT_PATH: ${{ inputs['prompt-path'] }}
          PR_NUMBER: ${{ inputs['pull-request-number'] }}
          REVIEW_GUIDANCE_BASE64: ${{ inputs['review-guidance-base64'] }}
          REVIEW_MODEL: ${{ inputs['model'] }}
          REVIEW_REASONING_EFFORT: ${{ inputs['reasoning-effort'] }}
          REVIEW_FILE: ${{ runner.temp }}/claude-review/claude-review.json
          TRIGGER_METADATA_BASE64: ${{ inputs['trigger-metadata-base64'] }}
        run: |
          bash .ai-review-toolkit/scripts/post_ai_review.sh \
            claude \
            "$EXPECTED_BASE_SHA" \
            "$EXPECTED_HEAD_SHA" \
            "$REVIEW_FILE"
