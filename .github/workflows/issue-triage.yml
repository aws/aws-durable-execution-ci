name: Issue Triage

on:
  issues:
    types: [opened]
  workflow_call:
    inputs:
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: medium
      labels:
        description: Newline-separated label names that Codex may apply
        required: false
        type: string
        default: |-
          pkg:sdk
          pkg:testing
          pkg:otel
          bug
          enhancement
          question
          documentation
          parity
          BREAKING
          urgent
          needs-triage
          needs-info
          good first issue
          help wanted
      prompt-path:
        description: Optional classification prompt path in the caller repository
        required: false
        type: string
        default: ""
    secrets:
      BEDROCK_ROLE_ARN:
        description: IAM role used to invoke Codex on Amazon Bedrock
        required: false

permissions: {}

env:
  # Non-workflow_call events do not populate reusable-workflow input defaults.
  DEFAULT_ISSUE_TRIAGE_LABELS: |-
    pkg:sdk
    pkg:testing
    pkg:otel
    bug
    enhancement
    question
    documentation
    parity
    BREAKING
    urgent
    needs-triage
    needs-info
    good first issue
    help wanted

concurrency:
  group: issue-triage-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify issue with Codex
    runs-on: ubuntu-latest
    environment: ai-pr-review-runtime
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: read

    steps:
      - name: Validate issue triage configuration
        id: triage-config
        env:
          TRIAGE_MODEL: ${{ inputs['model'] || 'openai.gpt-5.6-sol' }}
          TRIAGE_REASONING_EFFORT: >-
            ${{ inputs['reasoning-effort'] || 'medium' }}
        run: |
          set -euo pipefail

          if [[ ! "$TRIAGE_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
            echo "::error::Issue triage model must be a non-empty model ID."
            exit 1
          fi

          case "$TRIAGE_REASONING_EFFORT" in
            none|minimal|low|medium|high|xhigh|max)
              ;;
            *)
              echo "::error::Issue triage reasoning effort must be none, minimal, low, medium, high, xhigh, or max."
              exit 1
              ;;
          esac

          echo "model=$TRIAGE_MODEL" >> "$GITHUB_OUTPUT"
          echo "reasoning_effort=$TRIAGE_REASONING_EFFORT" >> "$GITHUB_OUTPUT"

      # Load only trusted support files from the immutable workflow revision.
      # The caller repository and issue submitter's code are never checked out.
      - name: Check out issue triage toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/prompts
            package.json
            package-lock.json
            scripts
            README.md
          persist-credentials: false

      - name: Prepare issue and label context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_LABELS_OVERRIDE: ${{ inputs['labels'] }}
        run: python3 scripts/issue_triage.py prepare

      - name: Resolve issue triage prompt
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CUSTOM_PROMPT_PATH: ${{ inputs['prompt-path'] }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/resolve_issue_triage_prompt.py
          .github/prompts/issue-triage.md
          .github/prompts/issue-triage-output.md
          .ai-issue-triage-context/prompt.md

      - name: Prepare unprivileged Codex user
        run: |
          bash scripts/prepare_ai_triage_user.sh

          # Codex runs through sudo, so preserve its AWS SDK credential chain.
          sudo sh -c \
            'printf "%s\n" \
              "Defaults:runner env_keep += \"AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION\"" \
              > /etc/sudoers.d/codex-triage-env'
          sudo chmod 440 /etc/sudoers.d/codex-triage-env
          sudo visudo -cf /etc/sudoers.d/codex-triage-env

          current_userns="$(
            sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true
          )"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(
            sysctl -n kernel.apparmor_restrict_unprivileged_userns \
              2>/dev/null || true
          )"
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Codex CLI
        run: bash scripts/install_codex_cli.sh .

      - name: Configure AWS credentials for Codex
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.BEDROCK_ROLE_ARN }}
          role-session-name: codex-issue-triage-${{ github.run_id }}
          aws-region: us-east-1
          inline-session-policy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": [
                  "bedrock-mantle:CreateInference",
                  "bedrock-mantle:GetProject",
                  "bedrock-mantle:ListProjects",
                  "bedrock-mantle:ListTagsForResources"
                ],
                "Resource": "*"
              }]
            }
          mask-aws-account-id: true
          output-credentials: true
          output-env-credentials: false

      - name: Classify issue with Codex on Amazon Bedrock
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TRIAGE_MODEL: ${{ steps.triage-config.outputs.model }}
          TRIAGE_REASONING_EFFORT: >-
            ${{ steps.triage-config.outputs.reasoning_effort }}
        run: |
          set -euo pipefail

          toolkit_dir="$GITHUB_WORKSPACE"
          codex_bin="$(command -v codex)"
          output_dir="$(
            sudo -u codex-triage mktemp -d -t codex-issue-triage.XXXXXX
          )"
          output_file="${output_dir}/result.json"
          runtime_schema="${output_dir}/schema.json"
          raw_result="${RUNNER_TEMP}/issue-triage-raw.json"
          validated_file="${RUNNER_TEMP}/issue-triage.json"
          prompt_file="${toolkit_dir}/.ai-issue-triage-context/prompt.md"
          context_file="${toolkit_dir}/.ai-issue-triage-context/context.json"
          output_schema="${toolkit_dir}/.ai-issue-triage-context/output-schema.json"
          trap 'sudo rm -rf "$output_dir"' EXIT

          trusted_prompt="$(cat "$prompt_file")"
          sudo install \
            -m 400 \
            -o codex-triage \
            -g codex-triage \
            "$output_schema" \
            "$runtime_schema"

          # The unprivileged user cannot traverse the workspace. Run from /tmp;
          # stdin is opened by the runner before sudo drops privileges.
          cd /tmp
          sudo -u codex-triage -- sh -c '
            : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID was not preserved by sudo}"
            : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY was not preserved by sudo}"
            : "${AWS_SESSION_TOKEN:?AWS_SESSION_TOKEN was not preserved by sudo}"
            : "${AWS_REGION:?AWS_REGION was not preserved by sudo}"
          '

          triage_ready=false
          for attempt in 1 2; do
            sudo -u codex-triage -- rm -f "$output_file"
            rm -f "$raw_result" "$validated_file"

            if sudo -u codex-triage -- timeout \
              --signal=TERM \
              --kill-after=30s \
              12m \
              env \
              CODEX_HOME=/home/codex-triage/.codex \
              "$codex_bin" \
              --ask-for-approval never \
              --sandbox read-only \
              --disable apps \
              --disable browser_use \
              --disable computer_use \
              --disable hooks \
              --disable image_generation \
              --disable multi_agent \
              --disable plugins \
              --disable shell_tool \
              --disable unified_exec \
              --disable view_image \
              --strict-config \
              --model "$TRIAGE_MODEL" \
              --config "model_reasoning_effort=\"${TRIAGE_REASONING_EFFORT}\"" \
              --config 'model_provider="amazon-bedrock"' \
              --config 'default_permissions=":read-only"' \
              --config 'web_search="disabled"' \
              --config 'allow_login_shell=false' \
              --config 'history.persistence="none"' \
              --config 'shell_environment_policy.inherit="none"' \
              exec \
              --ignore-user-config \
              --ignore-rules \
              --skip-git-repo-check \
              --cd "$output_dir" \
              --output-last-message "$output_file" \
              --output-schema "$runtime_schema" \
              --color never \
              --ephemeral \
              "$trusted_prompt" < "$context_file"
            then
              sudo install \
                -m 600 \
                -o runner \
                -g runner \
                "$output_file" \
                "$raw_result"

              if python3 "$toolkit_dir/scripts/issue_triage.py" validate \
                "$raw_result" \
                "$context_file" \
                "$validated_file"
              then
                triage_ready=true
                break
              fi

              echo "::warning::Codex attempt ${attempt} returned invalid issue labels."
            else
              echo "::warning::Codex attempt ${attempt} failed."
            fi
          done

          if [[ "$triage_ready" != "true" ]]; then
            echo "::error::Codex did not return valid issue labels after two attempts."
            exit 1
          fi

      - name: Upload issue triage result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-triage-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-triage.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  apply:
    name: Apply issue labels
    needs: classify
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out issue triage toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download issue triage result
        if: needs.classify.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-triage-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-triage

      - name: Validate and apply AI-selected labels
        if: needs.classify.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_LABELS_OVERRIDE: ${{ inputs['labels'] }}
        run: >-
          python3 scripts/issue_triage.py apply
          "${RUNNER_TEMP}/issue-triage/issue-triage.json"

      - name: Apply needs-triage fallback
        if: needs.classify.result != 'success' || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/issue_triage.py fallback
