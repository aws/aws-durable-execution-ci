name: Codex PR Review Address

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Optional pull request number with authorized feedback
        required: false
        type: string
        default: ""
      environment-name:
        description: GitHub environment used for the model job
        required: false
        type: string
        default: ai-pr-review-runtime
      no-pr-label:
        description: Label used by the shared Codex worker
        required: false
        type: string
        default: codex:no-pr
      max-pull-requests:
        description: Maximum discovered pull requests processed per run
        required: false
        type: number
        default: 3
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: choice
        options:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        default: xhigh
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      pull-request-number:
        description: Optional pull request number with authorized feedback
        required: false
        type: string
        default: ""
      environment-name:
        description: GitHub environment used for the model job
        required: false
        type: string
        default: ai-pr-review-runtime
      no-pr-label:
        description: Label used by the shared Codex worker
        required: false
        type: string
        default: codex:no-pr
      max-pull-requests:
        description: Maximum discovered pull requests processed per run
        required: false
        type: number
        default: 3
      model:
        description: Codex model ID to use through Amazon Bedrock
        required: false
        type: string
        default: openai.gpt-5.6-sol
      reasoning-effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: xhigh
      allow-workflow-changes:
        description: Allow Codex to change files under .github/workflows
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  resolve:
    name: Resolve PR review feedback
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/codex-work-item-resolver.yml
    with:
      work-scope: review
      requested-pull-request-number: >-
        ${{ inputs['pull-request-number'] || '' }}
      environment-name: >-
        ${{ inputs['environment-name'] || 'ai-pr-review-runtime' }}
      no-pr-label: >-
        ${{ inputs['no-pr-label'] || 'codex:no-pr' }}
      max-items: >-
        ${{ fromJSON(
            format('{0}', inputs['max-pull-requests']) ||
            '3'
          ) }}
      model: ${{ inputs['model'] || 'openai.gpt-5.6-sol' }}
      reasoning-effort: >-
        ${{ inputs['reasoning-effort'] || 'xhigh' }}
      allow-workflow-changes: >-
        ${{ inputs['allow-workflow-changes'] || false }}
      upload-work-items: true
